<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar | EchoLife Digital Memory Vault</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a class="brand-logo" href="index.html">
          <i class="bi bi-clock-history"></i>
          <span>EchoLife</span>
        </a>
      </div>

      <div class="sidebar-nav">
        <div class="nav-section-title">Main Workspace</div>
        <a href="dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a href="timeline.html" class="sidebar-link"><i class="bi bi-hourglass-split"></i> Timeline</a>
        <a href="gallery.html" class="sidebar-link"><i class="bi bi-images"></i> Gallery</a>
        <a href="calendar.html" class="sidebar-link active"><i class="bi bi-calendar-event"></i> Calendar</a>
        <a href="statistics.html" class="sidebar-link"><i class="bi bi-bar-chart-line-fill"></i> Statistics</a>

        <div class="nav-section-title">Archival Tools</div>
        <a href="add-memory.html" class="sidebar-link"><i class="bi bi-plus-circle-fill"></i> Add Memory</a>
        <a href="backup.html" class="sidebar-link"><i class="bi bi-cloud-arrow-down"></i> Backup & Sync</a>
        <a href="notifications.html" class="sidebar-link"><i class="bi bi-bell"></i> Notifications</a>

        <div class="nav-section-title">Account</div>
        <a href="profile.html" class="sidebar-link"><i class="bi bi-person-circle"></i> Profile</a>
        <a href="settings.html" class="sidebar-link"><i class="bi bi-gear"></i> Settings</a>
        <a href="help.html" class="sidebar-link"><i class="bi bi-question-circle"></i> Help & FAQ</a>
      </div>
    </aside>

    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="btn btn-icon sidebar-toggle-btn d-lg-none"><i class="bi bi-list fs-4"></i></button>
          <h5 class="text-white font-heading mb-0">Memory Calendar</h5>
        </div>

        <div class="topbar-right">
          <button class="btn btn-icon theme-toggle-btn"><i class="bi bi-moon-stars-fill theme-toggle-icon"></i></button>
          <a href="add-memory.html" class="btn btn-aurora btn-sm"><i class="bi bi-plus-lg"></i> Add Memory</a>
          <a href="profile.html" class="user-profile-badge">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" class="user-avatar" alt="Avatar">
          </a>
        </div>
      </header>

      <div class="content-body">
        <!-- Calendar Controls Header -->
        <div class="glass-card p-4 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div>
            <h2 id="calMonthYearLabel" class="text-white font-heading mb-0">August 2026</h2>
            <p class="text-secondary-custom small mb-0">Click any day to view memories recorded on that date.</p>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button id="calPrevMonth" class="btn btn-glass"><i class="bi bi-chevron-left"></i> Prev Month</button>
            <button id="calNextMonth" class="btn btn-glass">Next Month <i class="bi bi-chevron-right"></i></button>
          </div>
        </div>

        <!-- Monthly Grid Component -->
        <div class="glass-card p-4">
          <div class="calendar-grid mb-2">
            <div class="calendar-header-day">Sun</div>
            <div class="calendar-header-day">Mon</div>
            <div class="calendar-header-day">Tue</div>
            <div class="calendar-header-day">Wed</div>
            <div class="calendar-header-day">Thu</div>
            <div class="calendar-header-day">Fri</div>
            <div class="calendar-header-day">Sat</div>
          </div>
          <div id="calendarGridCells" class="calendar-grid"></div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
