<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | EchoLife Memory Archive</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-wrapper">
  
  <div class="hero-ambient-glow" style="top: 20%; width: 500px; height: 500px;"></div>

  <div class="glass-card auth-card rounded-4 shadow-lg" data-aos="zoom-in">
    <div class="text-center mb-4">
      <a class="brand-logo justify-content-center mb-2" href="index.html">
        <i class="bi bi-clock-history"></i>
        <span>EchoLife</span>
      </a>
      <h5 class="text-white font-heading mt-2">Reset Your Password</h5>
      <p class="text-secondary-custom small">Enter your account email to receive a password reset link.</p>
    </div>

    <form onsubmit="event.preventDefault(); alert('Reset link sent to your email!'); window.location.href='login.html';">
      <div class="mb-3">
        <label class="form-label text-white small font-semibold">Email Address</label>
        <input type="email" class="form-control form-control-custom" placeholder="alex@echolife.app" required>
      </div>

      <button type="submit" class="btn btn-aurora w-100 py-2 mb-3">Send Reset Instructions</button>
    </form>

    <div class="text-center border-top border-glass pt-3 mt-2">
      <a href="login.html" class="small text-secondary-custom"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
