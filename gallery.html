<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | EchoLife Digital Memory Vault</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a class="brand-logo" href="index.html">
          <i class="bi bi-clock-history"></i>
          <span>EchoLife</span>
        </a>
      </div>

      <div class="sidebar-nav">
        <div class="nav-section-title">Main Workspace</div>
        <a href="dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a href="timeline.html" class="sidebar-link"><i class="bi bi-hourglass-split"></i> Timeline</a>
        <a href="gallery.html" class="sidebar-link active"><i class="bi bi-images"></i> Gallery</a>
        <a href="calendar.html" class="sidebar-link"><i class="bi bi-calendar-event"></i> Calendar</a>
        <a href="statistics.html" class="sidebar-link"><i class="bi bi-bar-chart-line-fill"></i> Statistics</a>

        <div class="nav-section-title">Archival Tools</div>
        <a href="add-memory.html" class="sidebar-link"><i class="bi bi-plus-circle-fill"></i> Add Memory</a>
        <a href="backup.html" class="sidebar-link"><i class="bi bi-cloud-arrow-down"></i> Backup & Sync</a>
        <a href="notifications.html" class="sidebar-link"><i class="bi bi-bell"></i> Notifications</a>

        <div class="nav-section-title">Account</div>
        <a href="profile.html" class="sidebar-link"><i class="bi bi-person-circle"></i> Profile</a>
        <a href="settings.html" class="sidebar-link"><i class="bi bi-gear"></i> Settings</a>
        <a href="help.html" class="sidebar-link"><i class="bi bi-question-circle"></i> Help & FAQ</a>
      </div>
    </aside>

    <main class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="btn btn-icon sidebar-toggle-btn d-lg-none"><i class="bi bi-list fs-4"></i></button>
          <div class="search-bar-trigger">
            <i class="bi bi-search"></i>
            <span>Search photo gallery...</span>
          </div>
        </div>

        <div class="topbar-right">
          <button class="btn btn-icon theme-toggle-btn"><i class="bi bi-moon-stars-fill theme-toggle-icon"></i></button>
          <a href="add-memory.html" class="btn btn-aurora btn-sm"><i class="bi bi-plus-lg"></i> Add Photo</a>
          <a href="profile.html" class="user-profile-badge">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" class="user-avatar" alt="Avatar">
          </a>
        </div>
      </header>

      <div class="content-body">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
          <div>
            <h2 class="text-white font-heading mb-1"><i class="bi bi-images me-2 text-gradient"></i> Memory Gallery</h2>
            <p class="text-secondary-custom mb-0">Pinterest-style album view of your archived photos and videos.</p>
          </div>
          <a href="add-memory.html" class="btn btn-aurora"><i class="bi bi-cloud-arrow-up me-1"></i> Upload Media</a>
        </div>

        <!-- Filter Album Tabs -->
        <div class="d-flex flex-wrap gap-2 mb-4">
          <button class="btn btn-aurora gallery-tab-btn active" data-category="all">All Albums</button>
          <button class="btn btn-glass gallery-tab-btn" data-category="Travel">Travel ✈️</button>
          <button class="btn btn-glass gallery-tab-btn" data-category="Family">Family 👨‍👩‍👧</button>
          <button class="btn btn-glass gallery-tab-btn" data-category="Birthday">Birthday 🎂</button>
          <button class="btn btn-glass gallery-tab-btn" data-category="Graduation">Graduation 🎓</button>
          <button class="btn btn-glass gallery-tab-btn" data-category="Vacations">Vacations 🏖️</button>
        </div>

        <!-- Masonry Grid -->
        <div id="galleryMasonryGrid" class="masonry-grid"></div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
